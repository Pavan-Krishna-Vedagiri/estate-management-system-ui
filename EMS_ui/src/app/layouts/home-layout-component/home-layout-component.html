<header class="header">
    <div class="header-left">
        <h2 class="logo">🏠 Estate Portal</h2>
    </div>
    <div class="header-right">
        <span class="user-info">Welcome, Pavan</span>
        <button (click)="logout()" class="logout-btn">Logout</button>
    </div>
</header>

<div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <nav>
            <ul>
                <li class="nav-item">
                    <a routerLink="/dashboard">Dashboard</a>
                </li>
                <li class="nav-item" (click)="toggleResidents()">
                    <i class="fas fa-users"></i> Residents
                </li>
                @if (showResidents) {
                <ul class="sub-menu">
                    <li><a routerLink="/residents">Resident List</a></li>
                    <li><a routerLink="/residents/create">Add Resident</a></li>
                </ul>
                }
                <li class="nav-item">
                    <a routerLink="/rooms">Rooms</a>
                </li>
                <li class="nav-item">
                    <a routerLink="/invoices">Invoices</a>
                </li>
                <li class="nav-item">
                    <a routerLink="/payments">Payments</a>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="content">
        <router-outlet></router-outlet>
    </main>
</div>
