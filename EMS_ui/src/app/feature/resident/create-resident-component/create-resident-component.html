<div class="form-card" [formGroup]="residentForm">

  @if (showPopup) {
  <app-pop [message]="responseMessage" (closePopUp)="closeMessagePop($event)"></app-pop>
  }
  <h2 class="title">👤 Resident Form</h2>

  <div class="form-grid">
    <div class="form-field">
      <label><i class="fas fa-user"></i> First Name</label>
      <input type="text" formControlName="firstName" />
      @if (residentForm.get("firstName")?.invalid && residentForm.get("firstName")?.touched) {
      <span class="error">
        First name is required
      </span>
      }
    </div>

    <div class="form-field">
      <label><i class="fas fa-user"></i> Last Name</label>
      <input type="text" formControlName="lastName" />
    </div>

    <div class="form-field">
      <label><i class="fas fa-envelope"></i> Email</label>
      <input type="email" formControlName="email" />
    </div>

    <div class="form-field">
      <label><i class="fas fa-phone"></i> Phone</label>
      <input type="text" formControlName="phoneNumber" />
    </div>

    <div class="form-field">
      <label><i class="fas fa-user-shield"></i> Guardian Name</label>
      <input type="text" formControlName="guardianName" />
    </div>

    <div class="form-field">
      <label><i class="fas fa-envelope-open"></i> Guardian Email</label>
      <input type="email" formControlName="guardianEmail" />
    </div>

    <div class="form-field">
      <label><i class="fas fa-phone-alt"></i> Guardian Phone</label>
      <input type="text" formControlName="guardianPhoneNumber" />
    </div>

    <div class="form-field">
      <label><i class="fas fa-id-card"></i> SSN</label>
      <input type="text" formControlName="socialSecurityNumber" />
    </div>

    <div class="form-field">
      <label><i class="fas fa-briefcase"></i> Occupation</label>
      <input type="text" formControlName="occupationName" />
    </div>

    <div class="form-field">
      <label><i class="fas fa-building"></i> Company</label>
      <input type="text" formControlName="companyName" />
    </div>
  </div>

  <h3 class="subtitle">🏠 Address</h3>
  <div class="form-grid" formGroupName="address">
    <div class="form-field">
      <label>Door No</label>
      <input type="text" formControlName="doorNo" />
    </div>
    <div class="form-field">
      <label>Street</label>
      <input type="text" formControlName="street" />
    </div>
    <div class="form-field">
      <label>City</label>
      <input type="text" formControlName="city" />
    </div>
    <div class="form-field">
      <label>Country</label>
      <input type="text" formControlName="country" />
    </div>
    <div class="form-field">
      <label>Pincode</label>
      <input type="text" formControlName="pincode" />
    </div>
  </div>

  <div class="actions">
    @if(roomId){
    <button type="button" (click)="autoPopulate()"> Auto Populate</button>
    <button type="button" [disabled]="!residentForm.valid" (click)="sendResidentDetailsFn()">Book</button>
    }@else{
    <button type="submit" [disabled]="residentForm.invalid" (click)="createResisdent()">💾 Save</button>
    <button type="reset" (click)="autoPopulate()"> Auto Populate</button>
    }
    <button type="reset" (click)="resetForm()">❌ Reset</button>
  </div>
</div>
