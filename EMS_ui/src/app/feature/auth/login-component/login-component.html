<div class="login-container">
    <div class="login-box">
        <h2>Login</h2>
        @if (errorMessage) {
            <p style="color: red;">{{errorMessage}}</p>
        }
        <form class="form-group" [formGroup]="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username" formControlName="username"/>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password" formControlName="password"/>
            </div>

            <button type="submit" [disabled]="!loginForm.valid" (click)="login()">Login</button>
        </form>
    </div>
</div>
